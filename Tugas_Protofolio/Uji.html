<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sholat</title>
    <style>
        /* Mengatur font dan background halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9; /* Hijau mint yang sangat lembut */
            color: #1b5e20; /* Hijau gelap untuk teks agar mudah dibaca */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Kotak utama aplikasi */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.15); /* Bayangan bernuansa hijau */
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #2e7d32; /* Hijau daun */
            font-weight: 600;
        }

        /* Desain area input dan tombol */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1.5px solid #a5d6a7;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #43a047;
        }

        button {
            background-color: #43a047; /* Hijau utama yang menenangkan */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #2e7d32;
        }

        button:active {
            transform: scale(0.97);
        }

        /* Desain daftar jadwal sholat */
        #judul-lokasi {
            font-size: 18px;
            margin-bottom: 15px;
            color: #388e3c;
        }

        .jadwal-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .jadwal-item {
            background-color: #f1f8e9; /* Latar item hijau sangat pudar */
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            border-left: 5px solid #66bb6a; /* Garis aksen di sebelah kiri */
            transition: transform 0.2s;
        }

        .jadwal-item:hover {
            transform: translateX(5px); /* Efek geser sedikit saat disentuh/hover */
            background-color: #c8e6c9;
        }

        .waktu {
            color: #2e7d32;
            font-weight: 700;
            font-size: 18px;
        }

        /* Teks loading atau error */
        .pesan {
            font-style: italic;
            color: #66bb6a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Jadwal Sholat</h2>
        
        <div class="input-group">
            <input type="text" id="input-kota" placeholder="Masukkan nama kota..." value="Tasikmalaya">
            <button onclick="cariJadwal()">Cari</button>
        </div>

        <div id="judul-lokasi">Silakan cari kota Anda</div>
        
        <ul class="jadwal-list" id="daftar-jadwal">
            <!-- Hasil jadwal akan muncul di sini -->
        </ul>
    </div>

    <script>
        function cariJadwal() {
            const kotaPilihan = document.getElementById('input-kota').value;
            const tempatJadwal = document.getElementById('daftar-jadwal');
            const judulLokasi = document.getElementById('judul-lokasi');

            if (!kotaPilihan) return; // Mencegah pencarian jika input kosong

            judulLokasi.innerText = "Mencari jadwal untuk " + kotaPilihan + "...";
            tempatJadwal.innerHTML = "<li class='pesan'>Memuat data...</li>";

            const apiUrl = `https://api.aladhan.com/v1/timingsByCity?city=${kotaPilihan}&country=Indonesia`;

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if(data.code !== 200) {
                        judulLokasi.innerText = "Kota tidak ditemukan";
                        tempatJadwal.innerHTML = "<li class='pesan'>Silakan periksa kembali ejaan nama kota.</li>";
                        return;
                    }

                    // Menampilkan tanggal masehi dari API
                    const tanggal = data.data.date.readable;
                    judulLokasi.innerText = `${kotaPilihan.toUpperCase()}\n(${tanggal})`;

                    const waktu = data.data.timings;
                    
                    // Membuat format HTML untuk setiap waktu sholat
                    tempatJadwal.innerHTML = `
                        <li class="jadwal-item"><span>Subuh</span> <span class="waktu">${waktu.Fajr}</span></li>
                        <li class="jadwal-item"><span>Dzuhur</span> <span class="waktu">${waktu.Dhuhr}</span></li>
                        <li class="jadwal-item"><span>Ashar</span> <span class="waktu">${waktu.Asr}</span></li>
                        <li class="jadwal-item"><span>Maghrib</span> <span class="waktu">${waktu.Maghrib}</span></li>
                        <li class="jadwal-item"><span>Isya</span> <span class="waktu">${waktu.Isha}</span></li>
                    `;
                })
                .catch(error => {
                    judulLokasi.innerText = "Terjadi Kesalahan";
                    tempatJadwal.innerHTML = "<li class='pesan'>Gagal terhubung ke server. Pastikan internet Anda aktif.</li>";
                });
        }

        // Otomatis mencari jadwal saat web pertama kali dibuka
        window.onload = function() {
            cariJadwal();
        };

        // Menambahkan fitur tekan "Enter" pada keyboard untuk mencari
        document.getElementById('input-kota').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                cariJadwal();
            }
        });
    </script>

</body>
</html>
